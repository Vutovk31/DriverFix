name: DriverFix Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build + win-x64 publish (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: SDK evidence
        run: dotnet --info

      - name: Restore canonical solution
        run: dotnet restore DriverFix.sln

      - name: Build canonical solution
        run: dotnet build DriverFix.sln -c Release --no-restore --nologo

      - name: Publish user-facing executable
        run: dotnet publish DriverFix.Cli/DriverFix.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/user

      - name: Publish elevated worker
        run: dotnet publish DriverFix.Elevated/DriverFix.Elevated.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish/elevated

      - name: Verify canonical executable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/user/DriverFix.exe dist/DriverFix.exe
          Copy-Item publish/elevated/DriverFix.Elevated.exe dist/DriverFix.Elevated.exe
          $required = @('dist/DriverFix.exe', 'dist/DriverFix.Elevated.exe')
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing executable: $file" }
            $item = Get-Item $file
            if ($item.Length -le 0) { throw "Empty executable: $file" }
            $hash = Get-FileHash $file -Algorithm SHA256
            Write-Host "$($item.Name) bytes=$($item.Length) sha256=$($hash.Hash)"
          }

      - name: Smoke user-facing executable (read-only inventory)
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Connected devices:\s*\d+') { throw "DriverFix.exe smoke did not emit connected-device evidence" }

      - name: Smoke installed driver metadata (read-only CIM)
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe --driver-metadata-smoke 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe driver metadata smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Installed driver metadata:\s*[1-9]\d*') { throw "DriverFix.exe driver metadata smoke did not emit positive installed-driver evidence" }

      - name: Smoke evidence-backed diagnosis (read-only)
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe --diagnosis-smoke 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe diagnosis smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Diagnosis smoke:\s*PASS') { throw "Diagnosis smoke did not emit PASS evidence" }
          $deviceMatch = [regex]::Match($text, 'Connected devices:\s*(\d+)')
          $diagnosisMatch = [regex]::Match($text, 'Diagnoses:\s*(\d+)')
          if (-not $deviceMatch.Success -or -not $diagnosisMatch.Success) { throw "Diagnosis smoke did not emit count evidence" }
          if ([int]$deviceMatch.Groups[1].Value -le 0) { throw "Diagnosis smoke reported no connected devices" }
          if ($deviceMatch.Groups[1].Value -ne $diagnosisMatch.Groups[1].Value) { throw "Diagnosis count does not match connected device count" }

      - name: Smoke Windows Update driver candidate discovery (read-only WUA)
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe --wua-candidate-smoke 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe WUA candidate smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Windows Update driver candidates:\s*\d+') { throw "DriverFix.exe WUA candidate smoke did not emit candidate-search evidence" }

      - name: Smoke combined workstation read-only evidence path
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe --workstation-readonly-smoke 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe workstation read-only smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Workstation read-only smoke:\s*PASS') { throw "Combined smoke did not emit PASS evidence" }
          if ($text -notmatch 'Connected devices:\s*\d+') { throw "Combined smoke did not emit inventory evidence" }
          if ($text -notmatch 'Installed driver metadata:\s*[1-9]\d*') { throw "Combined smoke did not emit installed-driver evidence" }
          if ($text -notmatch 'Windows Update driver candidates:\s*\d+') { throw "Combined smoke did not emit WUA evidence" }

      - name: Smoke exact-INF backup export (no driver mutation)
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe --backup-export-smoke 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe backup export smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Backup export smoke:\s*PASS') { throw "Backup export smoke did not emit PASS evidence" }
          if ($text -notmatch 'Published INF:\s*oem\d+\.inf') { throw "Backup export smoke did not emit exact published-INF evidence" }
          if ($text -notmatch 'Exported files:\s*[1-9]\d*') { throw "Backup export smoke did not emit positive file-count evidence" }
          if ($text -notmatch 'Exported bytes:\s*[1-9]\d*') { throw "Backup export smoke did not emit positive byte-count evidence" }

      - name: Smoke repair preflight blocks before mutation
        shell: pwsh
        run: |
          $output = & ./dist/DriverFix.exe --repair-preflight-smoke 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()
          Write-Host $text
          if ($exitCode -ne 0) { throw "DriverFix.exe repair preflight smoke failed with exit code $exitCode" }
          if ($text -notmatch 'Repair preflight negative smoke:\s*BLOCKED') { throw "Repair preflight smoke did not prove blocked state" }
          if ($text -notmatch 'Verified driver backup is required before repair\.') { throw "Repair preflight smoke did not prove backup gate evidence" }
          if ($text -notmatch 'No ProcessRunner or PnPUtil operation is reachable') { throw "Repair preflight smoke did not prove no-mutation path evidence" }

      - name: Upload win-x64 package
        uses: actions/upload-artifact@v4
        with:
          name: DriverFix-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
