name: DriverFix Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: SDK evidence
        run: dotnet --info

      - name: Restore canonical solution
        run: dotnet restore DriverFix.sln

      - name: Build canonical solution
        run: dotnet build DriverFix.sln -c Release --no-restore --nologo
